packages:
  - benchmarks/*
  - integration/*
  - packages/@sanity/*
  - playground/*
  - css-playground/*
  - packages/@sanity/tsdown-config/test/fixtures/**

ignoreWorkspaceCycles: true

# Deduplicate compatible dependency versions during installation (pnpm >= 12.6.0).
autoDedupe: true

catalog:
  '@sanity/client': ^8.9.0
  '@sanity/icons': ^5.2.3
  '@sanity/logos': ^2.2.6
  '@tsdown/css': ^0.23.1
  '@types/node': ^24.19.1
  lightningcss: ^1.33.0
  oxc-transform-react: ^0.153.0
  publint: ^0.3.25
  tsdown: ^0.23.1
  typescript: 7.0.2
  vitest: ^5.0.3

# When running `pnpm add`, reuse a dependency's catalog version automatically if
# it already exists in a catalog, so shared deps stay aligned on a single version.
catalogMode: prefer

# Lifecycle scripts that must run for native/binary packages (pnpm v11 defaults
# strictDepBuilds to true, so unlisted packages fail the install).
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  unrs-resolver: true

# The pnpm v11 default (1 day)
minimumReleaseAge: 1440

# Exact-version exemptions for the locked versions that pnpm otherwise rejects against the
# release-age gate during resolution. Each entry expires naturally (and can be removed) once
# the version is older than minimumReleaseAge; add new ones only when a dependency bump needs
# a release fresher than the gate.
minimumReleaseAgeExclude:
  - '@next/*'
  - '@sanity/client@8.9.0'
  - '@astrojs/react@7.0.0'
  - '@yuku-parser/*'
  - '@oxc-transform-react/*'
  - '@rolldown/*'
  - oxc-transform-react
  - '@oxlint-tsgolint/*'
  - '@oxlint/*'
  - oxlint@1.87.0
  - rolldown
  - 'package-manager-detector@1.9.0'
  - '@vitejs/plugin-react@6.1.2'
  - '@microsoft/api-extractor@7.59.4'
  - '@microsoft/api-extractor-model@7.33.15'
  - '@rushstack/node-core-library@5.25.1'
  - '@rushstack/rig-package@0.7.4'
  - '@rushstack/terminal@0.24.7'
  - '@rushstack/ts-command-line@5.3.17'
  # @vanilla-extract/css@1.21.3 and @vanilla-extract/integration@8.0.11 (published 2026-10-08)
  - '@vanilla-extract/css@1.21.3'
  - '@vanilla-extract/integration@8.0.11'
minimumReleaseAgeExcludePrune: true

overrides:
  '@sanity/pkg-utils': workspace:*

# This is needed for prettier to be able to use the plugin specified by the `@sanity/prettier-config` preset
publicHoistPattern:
  - '*prettier*'

trustPolicy: no-downgrade

trustPolicyExclude:
  - chokidar@4.0.3
  - rxjs@7.8.2
  - semver@5.7.2 || 6.3.1
  - webpack-dev-middleware@7.4.6

trustPolicyExcludePrune: true
