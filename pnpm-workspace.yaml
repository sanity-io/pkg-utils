packages:
  - benchmarks/*
  - integration/*
  - packages/@sanity/*
  - playground/*
  - css-playground/*
  - packages/@sanity/tsdown-config/test/fixtures/**

ignoreWorkspaceCycles: true

# Deduplicate compatible dependency versions during installation (pnpm >= 12.6.0).
autoDedupe: true

catalog:
  '@sanity/client': ^8.6.2
  '@sanity/icons': ^5.2.2
  '@sanity/logos': ^2.2.5
  '@tsdown/css': ^0.23.0
  '@types/node': ^24.19.0
  lightningcss: ^1.33.0
  oxc-transform-react: ^0.151.0
  publint: ^0.3.24
  tsdown: ^0.23.0
  typescript: 7.0.2
  vitest: ^5.0.1

# When running `pnpm add`, reuse a dependency's catalog version automatically if
# it already exists in a catalog, so shared deps stay aligned on a single version.
catalogMode: prefer

# Lifecycle scripts that must run for native/binary packages (pnpm v11 defaults
# strictDepBuilds to true, so unlisted packages fail the install).
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  unrs-resolver: true

# The pnpm v11 default (1 day)
minimumReleaseAge: 1440

# Exact-version exemptions for the locked versions that pnpm otherwise rejects against the
# release-age gate during resolution. Each entry expires naturally (and can be removed) once
# the version is older than minimumReleaseAge; add new ones only when a dependency bump needs
# a release fresher than the gate.
minimumReleaseAgeExclude:
  - '@astrojs/react@7.0.0'
  - '@yuku-parser/*'
  - '@oxc-transform-react/*'
  - '@rolldown/*'
  - oxc-transform-react
  - '@oxlint-tsgolint/*'
  - oxlint-tsgolint@7.0.2002
  - '@oxlint/*'
  - oxlint@1.85.0
  - rolldown
  - '@types/node@24.13.6'
  # @microsoft/api-extractor@7.59.2 exact-pins these same-day sibling releases
  - '@microsoft/api-extractor@7.59.2'
  - '@microsoft/api-extractor-model@7.33.13'
  - '@rushstack/node-core-library@5.24.2'
  - '@rushstack/terminal@0.24.5'
  - '@rushstack/ts-command-line@5.3.15'
  # astro@7.3.4 exact-pins this same-day release
  - astro@7.3.4
  - '@astrojs/markdown-satteri@0.4.2'

minimumReleaseAgeExcludePrune: true

overrides:
  '@sanity/pkg-utils': workspace:*

# This is needed for prettier to be able to use the plugin specified by the `@sanity/prettier-config` preset
publicHoistPattern:
  - '*prettier*'

trustPolicy: no-downgrade

trustPolicyExclude:
  - chokidar@4.0.3
  - rxjs@7.8.2
  - semver@5.7.2 || 6.3.1
  - webpack-dev-middleware@7.4.6

trustPolicyExcludePrune: true
