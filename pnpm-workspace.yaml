packages:
  - benchmarks/*
  - integration/*
  - packages/@sanity/*
  - playground/*
  - css-playground/*
  - packages/@sanity/tsdown-config/test/fixtures/**

ignoreWorkspaceCycles: true

catalog:
  '@sanity/client': ^8.6.2
  '@sanity/icons': ^5.2.2
  '@sanity/logos': ^2.2.5
  '@tsdown/css': ^0.23.0
  '@types/node': ^24.13.6
  lightningcss: ^1.33.0
  oxc-transform-react: ^0.151.0
  publint: ^0.3.24
  tsdown: ^0.23.0
  typescript: 7.0.2
  vitest: ^5.0.1

# Lifecycle scripts that must run for native/binary packages (pnpm v11 defaults
# strictDepBuilds to true, so unlisted packages fail the install).
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  unrs-resolver: true

# The pnpm v11 default (1 day)
minimumReleaseAge: 1440

# Exact-version exemptions for the locked versions that pnpm otherwise rejects against the
# release-age gate during resolution. Each entry expires naturally (and can be removed) once
# the version is older than minimumReleaseAge; add new ones only when a dependency bump needs
# a release fresher than the gate.
minimumReleaseAgeExclude:
  - '@yuku-parser/*'
  - '@oxc-transform-react/*'
  - '@rolldown/*'
  - oxc-transform-react
  - '@oxlint-tsgolint/*'
  - oxlint-tsgolint@7.0.2002
  - '@oxlint/*'
  - oxlint@1.85.0
  - rolldown
  - '@types/node@24.13.6'
  # @microsoft/api-extractor@7.59.2 exact-pins these same-day sibling releases
  - '@microsoft/api-extractor@7.59.2'
  - '@microsoft/api-extractor-model@7.33.13'
  - '@rushstack/node-core-library@5.24.2'
  - '@rushstack/terminal@0.24.5'
  - '@rushstack/ts-command-line@5.3.15'

minimumReleaseAgeExcludePrune: true

overrides:
  '@sanity/pkg-utils': workspace:*
  # tsdown / @tsdown/css declare `rolldown: ~1.2.7`, which includes 1.2.9, but pnpm keeps
  # their previously locked 1.2.8 unless forced. Two copies make plugin types incompatible
  # (`MinimalPluginContext.environment` landed in 1.2.9) and the 1.2.9
  # `bundleAnalyzerPlugin` never writes `analyze-data.md` under tsdown's 1.2.8 runtime.
  # Scoped to these packages only — a workspace-wide `rolldown` override would also move
  # copies that pin an older range (and must not be used to yank vite off its own resolve).
  'tsdown>rolldown': '~1.2.9'
  '@tsdown/css>rolldown': '~1.2.9'

# This is needed for prettier to be able to use the plugin specified by the `@sanity/prettier-config` preset
publicHoistPattern:
  - '*prettier*'

trustPolicy: no-downgrade

trustPolicyExclude:
  - chokidar@4.0.3
  - rxjs@7.8.2
  - semver@5.7.2 || 6.3.1
  - webpack-dev-middleware@7.4.6

trustPolicyExcludePrune: true
