packages:
  - benchmarks/*
  - integration/*
  - packages/@sanity/*
  - playground/*
  - css-playground/*
  - packages/@sanity/tsdown-config/test/fixtures/**

ignoreWorkspaceCycles: true

# Deduplicate compatible dependency versions during installation (pnpm >= 12.6.0).
autoDedupe: true

catalog:
  '@pandacss/compiler': ^2.4.0
  '@pandacss/dev': ^2.4.0
  '@pandacss/transformer': ^2.4.0
  '@pandacss/vite': ^2.4.0
  '@sanity/client': ^8.11.0
  '@sanity/icons': ^5.2.3
  '@sanity/logos': ^2.2.6
  '@tsdown/css': ^0.23.1
  '@types/node': ^24.19.2
  '@vitest/browser-playwright': ^5.0.5
  lightningcss: ^1.33.0
  oxc-transform-react: ^0.155.0
  playwright: ^1.64.1
  postcss: ^8.5.31
  publint: ^0.3.25
  tsdown: ^0.23.1
  typescript: 7.0.2
  vitest: ^5.0.5

# When running `pnpm add`, reuse a dependency's catalog version automatically if
# it already exists in a catalog, so shared deps stay aligned on a single version.
catalogMode: prefer

# Lifecycle scripts that must run for native/binary packages (pnpm v11 defaults
# strictDepBuilds to true, so unlisted packages fail the install).
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  unrs-resolver: true

# The pnpm v11 default (1 day)
minimumReleaseAge: 1440

# Exact-version exemptions for the locked versions that pnpm otherwise rejects against the
# release-age gate during resolution. Each entry expires naturally (and can be removed) once
# the version is older than minimumReleaseAge; add new ones only when a dependency bump needs
# a release fresher than the gate.
minimumReleaseAgeExclude:
  # Name-level exemptions for packages whose Renovate PRs keep hitting the gate (fresh releases
  # land faster than the gate matures them; `next` patch releases are usually security fixes).
  - next
  - '@next/*'
  - react
  - react-dom
  - browserslist
  - '@sanity/client'
  - sanity
  - '@sanity/access-ui'
  - '@sanity/diff'
  - '@sanity/mutator'
  - '@sanity/schema'
  - '@sanity/types'
  - '@sanity/util'
  - '@sanity/validation'
  - '@yuku-parser/*'
  - '@sanity/ui'
  - '@oxc-transform-react/*'
  - '@rolldown/*'
  - oxc-transform-react
  - '@oxlint-tsgolint/*'
  - '@oxlint/*'
  - '@pandacss/*'
  - oxlint
  - rolldown
  - 'cac@7.1.0'
  - 'package-manager-detector@1.9.0'
  - '@vitejs/plugin-react@6.1.2'
  - '@microsoft/api-extractor@7.59.4'
  - '@microsoft/api-extractor-model@7.33.15'
  - 'styled-components@6.6.0'
  - 'zod@4.6.7'
  - '@rushstack/node-core-library@5.25.1'
  - '@rushstack/rig-package@0.7.4'
  - '@rushstack/terminal@0.24.7'
  - '@rushstack/ts-command-line@5.3.17'
  # @vanilla-extract/css@1.21.3 and @vanilla-extract/integration@8.0.11 (published 2026-10-08)
  - '@vanilla-extract/css@1.21.3'
  - '@vanilla-extract/integration@8.0.11'
minimumReleaseAgeExcludePrune: true

overrides:
  '@sanity/pkg-utils': workspace:*

# This is needed for prettier to be able to use the plugin specified by the `@sanity/prettier-config` preset
publicHoistPattern:
  - '*prettier*'

trustPolicy: no-downgrade

trustPolicyExclude:
  # The cssnano monorepo (github.com/cssnano/cssnano) published its 8.0.3–8.0.10 maintenance
  # releases as staged publishes (with an approver), while every 9.x release is a plain
  # trusted-publisher publish, so pnpm flags each 9.x version of these packages as a trust
  # downgrade (nuxt >= 4.6 depends on cssnano ^9.4). Name-level: every future bump trips again.
  - cssnano
  - chokidar@4.0.3
  - rxjs@7.8.2
  - semver@5.7.2 || 6.3.1
  - webpack-dev-middleware@7.4.6

trustPolicyExcludePrune: true
